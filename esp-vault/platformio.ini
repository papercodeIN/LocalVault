; PlatformIO configuration for LocalVault ESP
; Build for ESP32-C3, ESP8266 (D1 Mini), Raspberry Pi Pico W
;
; Usage:
;   pio run -e esp32c3      # Build for ESP32-C3 (e.g., XIAO ESP32C3, ESP32-C3-DevKitM-1)
;   pio run -e d1_mini      # Build for ESP8266 (Wemos D1 Mini)
;   pio run -e pico_w       # Build for Raspberry Pi Pico W
;   pio run -e esp32c3 -t upload   # Build and upload
;
; For Arduino IDE: see arduino-ide/ directory

[platformio]
default_envs = esp32c3, d1_mini, pico_w

; ============================================================
; Common build settings (extended by all environments)
; ============================================================
[common_env_data]
build_unflags = -Os
build_flags = 
  -DCORE_DEBUG_LEVEL=0
  -DLOCALVAULT_VERSION=1.0.0
  -O2
lib_deps = 
  bblanchon/ArduinoJson@^7.0.4
monitor_speed = 115200
upload_protocol = default

; ============================================================
; ESP32-C3 (e.g., XIAO ESP32C3, ESP32-C3-DevKitM-1, etc.)
; ============================================================
[env:esp32c3]
extends = common_env_data
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.flash_freq = 80000000L

; LittleFS 1.5 MB, rest for sketch
board_build.filesystem_size = 1.5m

; ESP32-specific flags
build_flags = ${common_env_data.build_flags} -DBOARD_HAS_PSRAM=0

monitor_filters = esp32_exception_decoder

; ============================================================
; ESP8266 - Wemos D1 Mini
; ============================================================
[env:d1_mini]
extends = common_env_data
platform = espressif8266
board = d1_mini
framework = arduino
board_build.flash_mode = dio
board_build.flash_freq = 40000000L
board_build.ldscript = eagle.flash.4m1m.ld

; LittleFS 1 MB (of 4 MB flash)
board_build.filesystem_size = 1m

monitor_filters = esp8266_exception_decoder

; ============================================================
; Raspberry Pi Pico W (RP2040 + WiFi)
; Uses maxgerhardt/platform-raspberrypi fork for Arduino-Pico core
; ============================================================
[env:pico_w]
extends = common_env_data
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower

; LittleFS 1 MB (of 2 MB flash)
board_build.filesystem_size = 1m

; Pico W specific
build_flags = ${common_env_data.build_flags} -DPICO_W

; ============================================================
; Custom targets (run with: pio run -e <env> -t <target>)
; ============================================================
; pio run -e esp32c3 -t buildfs   # Build filesystem image
; pio run -e esp32c3 -t uploadfs  # Upload filesystem
; pio run -e esp32c3 -t erase     # Erase flash